services:
  - type: web
    name: silelo-neo-connect
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_APP_ID
        sync: false
      - key: VITE_OAUTH_PORTAL_URL
        sync: false
      - key: VITE_FRONTEND_FORGE_API_URL
        sync: false
      - key: VITE_FRONTEND_FORGE_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: OWNER_OPEN_ID
        sync: false
      - key: BUILT_IN_FORGE_API_URL
        sync: false
      - key: BUILT_IN_FORGE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODELS
        value: openrouter/free,openai/gpt-oss-120b:free,qwen/qwen3-coder:free,deepseek/deepseek-r1:free,google/gemma-3-27b-it:free,meta-llama/llama-3.3-70b-instruct:free,mistralai/mistral-small-3.1-24b-instruct:free
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_FREE_MODELS
        value: llama-3.1-8b-instant,gemma2-9b-it
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      - key: QWEN_FREE_MODELS
        value: qwen-turbo,qwen-plus
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_MODEL
        value: gemini-2.0-flash-exp
      - key: MCP_ENABLED
        value: "false"
      - key: MCP_WRITE_ENABLED
        value: "false"
      - key: MCP_SERVER_URL
        value: http://localhost:3001/mcp
      - key: APP_URL
        value: https://silelo-neo-connect.onrender.com
